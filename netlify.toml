[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/qa"
  to = "/.netlify/functions/qa"
  status = 200

[[redirects]]
  from = "/explain"
  to = "/.netlify/functions/explain"
  status = 200

[[redirects]]
  from = "/quiz"
  to = "/.netlify/functions/quiz"
  status = 200

[[redirects]]
  from = "/summarize"
  to = "/.netlify/functions/summarize"
  status = 200

[[redirects]]
  from = "/learn/recommendations"
  to = "/.netlify/functions/learning-path"
  status = 200

[[redirects]]
  from = "/api/qa"
  to = "/.netlify/functions/qa"
  status = 200

[[redirects]]
  from = "/api/explain"
  to = "/.netlify/functions/explain"
  status = 200

[[redirects]]
  from = "/api/quiz"
  to = "/.netlify/functions/quiz"
  status = 200

[[redirects]]
  from = "/api/summarize"
  to = "/.netlify/functions/summarize"
  status = 200

[[redirects]]
  from = "/api/learn/recommendations"
  to = "/.netlify/functions/learning-path"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
